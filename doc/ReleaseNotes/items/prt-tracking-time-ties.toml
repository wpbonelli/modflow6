section = "fixes"
subsection = "model"
description = "The PRT Model could report a user tracking time twice for the same particle when the time coincided with the particle's release, with a cell or subcell exit, or with the end of a time step, once on each side of the boundary. Each tracking time is now reported at most once per particle, at the earliest opportunity, for example in the cell the particle is leaving. Other events at the same time, such as the release or the exit, are still reported. In addition, a particle released or arriving on the face it exits through could be given a tiny nonzero (sometimes negative) travel time instead of zero, depending on the compiler and floating point optimizations. This could change which events were reported or drop a tracking time altogether. Such exits now take exactly zero time, and near-ties between an exit and the end of a time step, a tracking time or the water table are resolved the same way regardless of roundoff. Track output may be shorter where duplicate records were previously written."
