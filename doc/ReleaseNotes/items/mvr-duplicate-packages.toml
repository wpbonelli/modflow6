section = "fixes"
subsection = "internal"
description = "The Water Mover (MVR) Package accepted a package listed more than once in the PACKAGES block. The duplicate was counted again in the mover budget written to the listing file, which overstated the package's totals, and it added empty terms with the same names to the budget file. MODFLOW 6 now terminates with an error when a package is listed more than once in the PACKAGES block of a model or exchange mover. Packages with the same name in different models are still allowed in an exchange mover."
