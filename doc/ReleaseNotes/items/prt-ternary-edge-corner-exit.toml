section = "fixes"
subsection = "model"
description = "A particle tracked with the ternary method exactly along an internal edge between triangular subcells, e.g. one released at a cell center on a line of symmetry in the flow field, could be terminated with status 9 (no exit from the subcell), typically at the start of a later time step. Since the particle reaches a face only where the edge meets it, at a corner, roundoff could place the exit just outside the face, where it was rejected, while the edge itself has no normal flow and gives no exit either. Exits within the exit solve tolerance of a corner are now accepted and placed on the face."
