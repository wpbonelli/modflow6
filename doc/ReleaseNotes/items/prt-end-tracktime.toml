section = "fixes"
subsection = "model"
description = "PRT could drop a user tracking time at the end of tracking, when the end is a floating point sum that comes out slightly below the time given for the tracking time. This happened at the end of the simulation without EXTEND\\_TRACKING, e.g. 0.9999999999999999 instead of 1.0 for ten stress periods of 0.1, and at a particle's stop time from STOPTRAVELTIME, e.g. 0.7999999999999999 for a release at 0.7 with a travel time of 0.1. A tracking time within roundoff after either end is now reported, and the particle's final time step and termination events are reported at the same time. Similarly, a release time within roundoff after the end of the simulation is no longer skipped. PRT now also warns about tracking times after the end of the simulation that will not be reported."
