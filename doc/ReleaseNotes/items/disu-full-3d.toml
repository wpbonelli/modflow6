section = "features"
subsection = "basic"
description = "A new FULL\\_3D option has been added to the Unstructured Discretization (DISU) Package for fully three-dimensional unstructured grids, such as 3D Voronoi grids, in which cells are not organized in layers and have no top and bottom elevation. With this option the cell volumes (VOLUME) and cell center coordinates (XCELL, YCELL, ZCELL) are specified instead of TOP, BOT, and AREA, every connection has IHC = 3, and HWVA is the area of the face shared by two cells. The flow between two cells is calculated from the face area, the distances from the cell centers to the face, and the hydraulic conductivity tensor projected on the direction between the cell centers, so anisotropy specified with K22, K33, and ANGLE1 to ANGLE3 is applied in three dimensions. All cells are confined and fully saturated. The XT3D and SAVE\\_SPECIFIC\\_DISCHARGE options are supported. The option is also available in the DISU Packages of the GWT and GWE Models, which are then supported with the advection, dispersion, conduction, and storage Packages, and GWF-GWF exchanges can connect two models that use it (IHC = 3 for all exchanges). The CHD, WEL, DRN, RIV, GHB, RCH, EVT, SFR, MAW, and LAK Packages can be used. RCH and EVT use the optional AREA array of the DISU Package, the surface area of each cell that is exposed to recharge or evapotranspiration, MAW is limited to the SPECIFIED and MEAN conductance equations, and LAK to HORIZONTAL connections with TELEV and BELEV specified. The NEWTON, REWET, THICKSTRT, PERCHED, VARIABLECV, DEWATERED, and ALTERNATIVE\\_CELL\\_AVERAGING options, convertible cells (ICELLTYPE and ICONVERT), the STORAGECOEFFICIENT option, the BUY, VSC, GNC, HFB, CSUB, and UZF Packages, and GWT-GWT and GWE-GWE exchanges are not supported. The optional VTU\\_GEOMETRY and VTU\\_FILEOUT options of the DISU Package (GWF, GWT, and GWE) make the model write the results of fully three-dimensional grids in VTK XML format: the cell polyhedra are read from a geometry file, and for each time step in which the head, concentration, or temperature is saved by the Output Control Package, a .vtu file (with the dependent variable, the specific discharge if saved, and the cell volume) is written, together with a ParaView .pvd collection. Existing DISU input and results are unchanged."
