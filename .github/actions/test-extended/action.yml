name: Test Extended MF6
description: Build and test Extended MODFLOW 6
runs:
  using: "composite"
  steps:
    # gfortran, MPI, PETSc and NetCDF all come from the pixi
    # gcc-extended-build environment, built by conda-forge
    - name: Custom pixi install
      shell: bash
      working-directory: modflow6
      run: pixi run -e gcc-extended-build install

    - name: Update netcdf-fortran.pc
      shell: bash
      working-directory: modflow6
      run: pixi run -e gcc-extended-build gcc-extended-build-update

    - name: Show toolchain
      shell: bash
      working-directory: modflow6
      run: |
        pixi run -e gcc-extended-build gfortran --version | head -1
        pixi run -e gcc-extended-build mpiexec --version | head -1
        pixi run -e gcc-extended-build nf-config --all

    - name: Build modflow6
      shell: bash
      working-directory: modflow6
      run: |
        pixi run -e gcc-extended-build setup builddir -Dextended=true -Dunit_tests=enabled
        pixi run -e gcc-extended-build build builddir
        pixi run -e gcc-extended-build test builddir

    - name: Show Meson logs
      if: failure()
      shell: bash
      working-directory: modflow6
      run: cat builddir/meson-logs/meson-log.txt

    - name: Build mf5to6
      shell: bash
      working-directory: modflow6
      run: |
        pixi run -e gcc-extended-build setup-mf5to6 builddir
        pixi run -e gcc-extended-build build-mf5to6 builddir

    - name: Update flopy
      shell: bash
      working-directory: modflow6
      run: |
        cmd="pixi run -e gcc-extended-build update-flopy --dfnpath doc/mf6io/mf6ivar/dfn"
        if [[ "${{ env.RELEASEMODE }}" == "true" ]]; then
          cmd="$cmd --releasemode"
        fi
        eval "$cmd"

    - name: Get executables
      shell: bash
      working-directory: modflow6
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: pixi run -e gcc-extended-build get-exes

    - name: Check lib dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      working-directory: modflow6
      run: otool -L bin/libmf6.dylib

    - name: Check lib dependencies (Linux)
      if: runner.os != 'macOS'
      shell: bash
      working-directory: modflow6
      run: ldd bin/libmf6.so

    - name: Test programs
      working-directory: modflow6
      shell: bash
      env:
        REPOS_PATH: ${{ github.workspace }}
        MARKERS: ${{ env.MARKERS }}
        FILTERS: ${{ env.FILTERS }}
      run: |
        cmd="pixi run -e gcc-extended-build autotest --parallel --netcdf"
        if [[ "${{ env.MARKERS }}" != "" ]]; then
          cmd="$cmd -m '$MARKERS'"
        fi
        if [[ "${{ env.FILTERS }}" != "" ]]; then
          cmd="$cmd -k '$FILTERS'"
        fi
        eval "$cmd"
